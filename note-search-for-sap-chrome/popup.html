<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAP Note Search</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-mark">SAP</span>
        <span class="brand-text">Note Search</span>
      </div>
      <button id="theme-toggle" class="theme-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <form id="search-form" autocomplete="off">
      <label for="note-input" class="label">Note number</label>
      <div class="input-row">
        <input
          type="text"
          id="note-input"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="e.g. 2937925"
          autofocus
          required
        >
        <button type="submit" id="open-btn" title="Open note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
      <p id="error-msg" class="error" hidden>Please enter a valid note number.</p>
    </form>

    <section id="history-section" class="history" hidden>
      <div class="divider"><span>recent</span></div>
      <ul id="history-list"></ul>
    </section>

    <div class="divider"><span>quick links</span></div>

    <nav class="links">
      <a href="https://me.sap.com/servicerequest" data-url="https://me.sap.com/servicerequest" class="link-item">
        <span class="link-name">Service Requests</span>
        <span class="link-arrow">→</span>
      </a>
      <a href="https://me.sap.com/servicessupport/cases" data-url="https://me.sap.com/servicessupport/cases" class="link-item">
        <span class="link-name">Cases</span>
        <span class="link-arrow">→</span>
      </a>
      <a href="https://me.sap.com/softwarecenter" data-url="https://me.sap.com/softwarecenter" class="link-item">
        <span class="link-name">Software Center</span>
        <span class="link-arrow">→</span>
      </a>
    </nav>

    <footer>
      <span class="hint">Alt+S to open · Enter to search</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
